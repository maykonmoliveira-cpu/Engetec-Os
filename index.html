<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3b78"><title>ENGETEC | Ordem de Serviço</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172334;font:15px system-ui}header{background:#0b3b78;color:white;padding:20px;font-size:23px;font-weight:800}main{max-width:1000px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #dce3ec;border-radius:12px;padding:17px;margin-bottom:14px}h2{font-size:17px;color:#0b3b78;border-bottom:1px solid #ddd;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.f{grid-column:span 12}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}label{display:block;font-size:13px;font-weight:650;margin:5px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #bbc7d5;border-radius:7px;font:inherit}textarea{min-height:70px}button{padding:10px 14px;margin:5px 4px 0 0;border:0;border-radius:7px;background:#0b3b78;color:white;font-weight:650}.alt{background:#e7eef7;color:#0b3b78}.danger{background:#a52c2c}.hidden{display:none!important}.notice{padding:10px;background:#edf5ff;border-radius:7px}.muted{color:#64748b;font-size:13px}.os{padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:8px}canvas{width:100%;height:120px;border:1px dashed #999;touch-action:none;border-radius:7px}@media(max-width:650px){.s3,.s4,.s6{grid-column:span 12}}@media print{header,.no-print,#login,#listCard{display:none!important}}
</style></head><body><header>ENGETEC <small style="font-size:12px;font-weight:400">| ORDEM DE SERVIÇO TÉCNICA</small></header><main>
<section id="login" class="card"><h2>Acesso</h2><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="loginBtn">Entrar</button><button id="signupBtn" class="alt">Criar conta</button><p id="loginMsg" class="notice"></p></section>
<div id="app" class="hidden"><section class="card no-print"><button id="newBtn" class="alt">Nova OS</button><button id="logoutBtn" class="alt">Sair</button><span id="who" class="muted"></span><p id="msg" class="notice hidden"></p></section>
<form id="form" class="card"><h2 id="heading">Nova Ordem de Serviço</h2><div class="grid">
<div class="f s3"><label>Número da OS</label><input id="num" readonly value="Gerado pelo banco"></div><div class="f s3"><label>Data</label><input id="data" type="date" required></div><div class="f s3"><label>Hora</label><input id="hora" type="time"></div><div class="f s3"><label>Status</label><select id="status"><option>Aberta</option><option>Em andamento</option><option>Concluída</option></select></div></div>
<h2>Cliente</h2><div class="grid"><div class="f s6"><label>Nome / Razão social *</label><input id="cliente" required></div><div class="f s3"><label>CPF / CNPJ</label><input id="documento"></div><div class="f s3"><label>Contato</label><input id="contato"></div><div class="f"><label>Endereço</label><input id="endereco"></div></div>
<h2>Equipamento</h2><div class="grid"><div class="f s4"><label>Tipo *</label><select id="equipamento" required><option value="">Selecione</option><option>Autoclave</option><option>Termodesinfectora</option><option>Lavadora ultrassônica</option><option>Seladora</option><option>Monitor multiparamétrico</option><option>Outro</option></select></div><div class="f s4"><label>Marca</label><input id="marca"></div><div class="f s4"><label>Modelo</label><input id="modelo"></div><div class="f s6"><label>Nº de série</label><input id="serie"></div><div class="f s6"><label>Patrimônio</label><input id="patrimonio"></div></div>
<h2>Atendimento técnico</h2><div class="grid"><div class="f"><label>Relato do cliente</label><textarea id="relato"></textarea></div><div class="f"><label>Diagnóstico</label><textarea id="diagnostico"></textarea></div><div class="f"><label>Serviço executado</label><textarea id="servico"></textarea></div><div class="f s6"><label>Peças / materiais</label><textarea id="pecas"></textarea></div><div class="f s6"><label>Técnico responsável *</label><input id="tecnico" required></div></div>
<h2>Assinaturas</h2><div class="grid"><div class="f s6"><label>Cliente</label><canvas id="sigC"></canvas><button type="button" class="alt" onclick="clearSig('sigC')">Limpar</button></div><div class="f s6"><label>Técnico</label><canvas id="sigT"></canvas><button type="button" class="alt" onclick="clearSig('sigT')">Limpar</button></div></div>
<div class="no-print"><button id="saveBtn">Salvar OS</button><button type="button" class="alt" id="printBtn">Imprimir / PDF</button></div></form>
<section id="listCard" class="card no-print"><h2>Ordens cadastradas</h2><input id="search" placeholder="Buscar número ou cliente"><div id="list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://sgyyfigxqeoobbtszqdv.supabase.co";
const SUPABASE_KEY="sb_publishable_TlAC5LaFcS_3-WpAgUQeWQ_vOyautpO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,rows=[],editing=null;
const $=x=>document.getElementById(x),fields=["data","hora","status","cliente","documento","contato","endereco","equipamento","marca","modelo","serie","patrimonio","relato","diagnostico","servico","pecas","tecnico"];
function msg(id,s){$(id).textContent=s;$(id).classList.remove("hidden")}
function sig(id){let c=$(id),x=c.getContext("2d"),down=false;c.width=c.clientWidth*devicePixelRatio;c.height=120*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=2;x.lineCap="round";c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect();x.beginPath();x.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(!down)return;let r=c.getBoundingClientRect();x.lineTo(e.clientX-r.left,e.clientY-r.top);x.stroke()};["pointerup","pointercancel"].forEach(v=>c.addEventListener(v,()=>down=false));return c}
const c1=sig("sigC"),c2=sig("sigT");function clearSig(id){let c=$(id);c.getContext("2d").clearRect(0,0,c.width,c.height)}
function signature(c){return c.toDataURL("image/png")}
function dateNow(){let d=new Date();$("data").value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);$("hora").value=d.toTimeString().slice(0,5)}
function reset(){editing=null;$("form").reset();$("num").value="Gerado pelo banco";$("heading").textContent="Nova Ordem de Serviço";clearSig("sigC");clearSig("sigT");dateNow()}
function detail(){let o={};fields.forEach(k=>o[k]=$(k).value);o.assinatura_cliente=signature(c1);o.assinatura_tecnico=signature(c2);return o}
function parse(s){try{return JSON.parse(s||"{}")}catch{return{}}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function enter(create){let email=$("email").value.trim(),password=$("password").value;if(!email||!password){msg("loginMsg","Informe e-mail e senha.");return}let r=create?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error){msg("loginMsg",r.error.message);return}if(create&&!r.data.session){msg("loginMsg","Confirme o e-mail recebido e depois entre.");return}await start()}
async function start(){let r=await db.auth.getSession();user=r.data.session?.user;if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=user.email;reset();await load()}
async function load(){let r=await db.from("ordens_servico").select("id,numero_os,tipo,descricao,tecnico_responsavel,status,data_abertura,data_conclusao,user_id").order("numero_os",{ascending:false});if(r.error){msg("msg","Erro ao carregar: "+r.error.message);return}rows=r.data||[];render()}
function render(){let q=$("search").value.toLowerCase();let a=rows.filter(o=>(" "+o.numero_os+" "+o.tipo+" "+parse(o.descricao).cliente).toLowerCase().includes(q));$("list").innerHTML=a.map(o=>{let d=parse(o.descricao);return `<div class="os"><b>ENGETEC-OS-${String(o.numero_os).padStart(6,"0")}</b> · ${esc(d.cliente)}<div class="muted">${esc(o.tipo)} — ${esc(o.status)}</div><button class="alt" onclick="editOS('${o.id}')">Editar</button><button class="danger" onclick="deleteOS('${o.id}')">Excluir</button></div>`}).join("")||"<p class=muted>Nenhuma OS cadastrada.</p>"}
window.editOS=id=>{let o=rows.find(v=>v.id===id);if(!o)return;let d=parse(o.descricao);editing=id;fields.forEach(k=>$(k).value=d[k]??"");$("num").value="ENGETEC-OS-"+String(o.numero_os).padStart(6,"0");$("heading").textContent="Editar ordem";$("form").scrollIntoView({behavior:"smooth"})};
window.deleteOS=async id=>{if(!confirm("Excluir esta OS?"))return;let r=await db.from("ordens_servico").delete().eq("id",id);if(r.error)msg("msg",r.error.message);else{msg("msg","OS excluída.");await load()}};
$("form").onsubmit=async e=>{e.preventDefault();$("saveBtn").disabled=true;try{let d=detail(),p={tipo:d.equipamento,descricao:JSON.stringify(d),tecnico_responsavel:d.tecnico,status:d.status};if(d.data)p.data_abertura=new Date(d.data+"T"+(d.hora||"00:00")+":00").toISOString();if(d.status==="Concluída")p.data_conclusao=new Date().toISOString();else p.data_conclusao=null;let r=editing?await db.from("ordens_servico").update(p).eq("id",editing).select("id,numero_os").single():await db.from("ordens_servico").insert(p).select("id,numero_os").single();if(r.error)throw r.error;msg("msg","OS salva: ENGETEC-OS-"+String(r.data.numero_os).padStart(6,"0"));reset();await load()}catch(e){msg("msg","Erro ao salvar: "+e.message)}finally{$("saveBtn").disabled=false}};
$("loginBtn").onclick=()=>enter(false);$("signupBtn").onclick=()=>enter(true);$("logoutBtn").onclick=async()=>{await db.auth.signOut();await start()};$("newBtn").onclick=reset;$("printBtn").onclick=()=>window.print();$("search").oninput=render;start();
</script></body></html>
